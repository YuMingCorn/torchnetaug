[project]
name = "torchnetaug"
version = "0.1.0"
description = "Network Augmentation (NetAug) for tiny neural networks in plain PyTorch"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
examples = [
    "matplotlib>=3.10.9",
    "torchvision",
]

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
    "onnx>=1.23.2",
    "onnxruntime>=1.23.2",
    "onnxscript>=0.7.2",
    "pytest>=8",
    "torchvision",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/torchnetaug"]

[tool.hatch.build.targets.sdist]
only-include = ["src/torchnetaug", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["netaug", ".git", ".venv"]

[tool.ruff]
extend-exclude = ["netaug"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
